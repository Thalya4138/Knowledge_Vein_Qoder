<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" width="220" height="170" role="img" aria-labelledby="title desc">
  <title id="title">三个数据点与两条候选直线</title>
  <desc id="desc">在 t 为 1、2、3 时分别测得 b 为 1、2、2；三条竖直虚线帮助比较候选直线，三个点不在同一直线上。</desc>
          <g stroke="#9bb" stroke-width="1"><line x1="30" y1="145" x2="210" y2="145"/><line x1="30" y1="145" x2="30" y2="10"/></g>
          <g font-size="11" fill="#567" font-family="serif">
            <text x="205" y="160">t</text><text x="16" y="16">b</text>
            <text x="70" y="160">1</text><text x="120" y="160">2</text><text x="170" y="160">3</text>
            <text x="18" y="109">1</text><text x="18" y="69">2</text>
          </g>
          <g stroke="#cfdde6" stroke-dasharray="3 3"><line x1="30" y1="105" x2="210" y2="105"/><line x1="30" y1="65" x2="210" y2="65"/></g>
          <line x1="40" y1="137" x2="200" y2="47" stroke="#e3a33b" stroke-width="1.2" stroke-dasharray="5 3"/>
          <line x1="40" y1="120" x2="200" y2="40" stroke="#c97fb0" stroke-width="1.2" stroke-dasharray="5 3"/>
          <g fill="#1f7fbf"><circle cx="73" cy="105" r="4"/><circle cx="123" cy="65" r="4"/><circle cx="173" cy="65" r="4"/></g>
        </svg>
