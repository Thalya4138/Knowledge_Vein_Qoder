<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="'Times New Roman','Songti SC','Noto Serif SC',SimSun,serif" font-size="15">
  <title>列相关时多个参数给出同一个最近点</title>
  <desc>左图参数平面中，特解 x0 沿核方向 d 移动得到无穷多参数；右图数据空间中，它们经同一个矩阵 A 都映到列空间直线上的同一点 p。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#355c72"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#b5661f"/></marker>
  </defs>
  <rect x="12" y="14" width="304" height="250" rx="10" fill="#eef6fa" stroke="#9fc3d5"/>
  <text x="28" y="39" fill="#355c72">参数空间：x₀ + ker(A)</text>
  <line x1="56" y1="226" x2="282" y2="226" stroke="#81939d" marker-end="url(#a)"/>
  <line x1="56" y1="226" x2="56" y2="62" stroke="#81939d" marker-end="url(#a)"/>
  <text x="282" y="244" font-style="italic">x₁</text><text x="36" y="60" font-style="italic">x₂</text>
  <line x1="78" y1="242" x2="248" y2="86" stroke="#b5661f" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="167" cy="164" r="5" fill="#b5661f"/>
  <circle cx="213" cy="128" r="5" fill="#b5661f"/>
  <line x1="167" y1="164" x2="213" y2="128" stroke="#b5661f" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="174" y="190" fill="#8e4e17">x₀ = (17/14, 0)</text>
  <text x="217" y="112" fill="#8e4e17">x₀ + s d</text>
  <text x="86" y="74" fill="#8e4e17" font-size="14">d = (−2, 1)，Ad = 0</text>
  <text x="28" y="252" fill="#5c6f7a" font-size="13">直线上的每个参数都被 A 压到同一点。</text>

  <line x1="338" y1="137" x2="394" y2="137" stroke="#355c72" stroke-width="2" marker-end="url(#a)"/>
  <text x="366" y="124" text-anchor="middle" font-style="italic" font-size="18">A</text>

  <rect x="404" y="14" width="304" height="250" rx="10" fill="#eef6fa" stroke="#9fc3d5"/>
  <text x="420" y="39" fill="#355c72">数据空间：一维列空间</text>
  <line x1="458" y1="238" x2="673" y2="57" stroke="#355c72" stroke-width="3"/>
  <line x1="468" y1="238" x2="668" y2="238" stroke="#a2b0b8"/>
  <line x1="468" y1="238" x2="468" y2="62" stroke="#a2b0b8"/>
  <text x="674" y="56" fill="#355c72">a₁ = (1,2,3)</text>
  <circle cx="552" cy="151" r="6" fill="#b5661f"/>
  <text x="563" y="143" fill="#8e4e17">p = (17/14, 17/7, 51/14)</text>
  <text x="420" y="252" fill="#5c6f7a" font-size="13">A = [a₁  2a₁]；列方向重复，像却仍是一条直线。</text>
</svg>
