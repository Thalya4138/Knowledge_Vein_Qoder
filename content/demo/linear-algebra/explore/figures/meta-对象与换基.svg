<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="'Times New Roman','Songti SC','Noto Serif SC',SimSun,serif" font-size="15">
  <title>同一张矩阵在不同对象和换基规则下含义不同</title>
  <desc>矩阵作为映射时输入输出各换基，作为算子时两边同换基，作为双线性型时两个位置同时换基。相同数表不表示相同对象。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#355c72"/></marker>
  </defs>
  <g fill="#f7fafc" stroke="#c7d6df" stroke-width="1.3">
    <rect x="12" y="12" width="244" height="326" rx="10"/>
    <rect x="268" y="12" width="244" height="326" rx="10"/>
    <rect x="524" y="12" width="244" height="326" rx="10"/>
  </g>
  <g font-size="22" font-style="italic" fill="#173f56">
    <text x="134" y="68" text-anchor="middle">B</text><text x="390" y="68" text-anchor="middle">B</text><text x="646" y="68" text-anchor="middle">B</text>
  </g>
  <g fill="#355c72" text-anchor="middle" font-size="17">
    <text x="134" y="107">映射 V → W</text><text x="390" y="107">算子 V → V</text><text x="646" y="107">双线性型</text>
  </g>
  <g fill="#173f56" text-anchor="middle" font-size="19">
    <text x="134" y="159">Q⁻¹BP</text><text x="390" y="159">P⁻¹BP</text><text x="646" y="159">PᵀBP</text>
  </g>
  <g fill="#5c6f7a" text-anchor="middle" font-size="14">
    <text x="134" y="197">输入与输出</text><text x="134" y="218">各选一组基</text>
    <text x="390" y="197">输入与输出同一空间</text><text x="390" y="218">只能同换一组基</text>
    <text x="646" y="197">两个位置都是输入</text><text x="646" y="218">同时换同一组基</text>
  </g>
  <g fill="#8e4e17" text-anchor="middle" font-size="15">
    <text x="134" y="270">留下：秩</text><text x="390" y="270">留下：特征值与块结构</text><text x="646" y="270">留下：正负惯性指数</text>
  </g>
  <g stroke="#355c72" stroke-width="1.5" marker-end="url(#a)">
    <line x1="256" y1="176" x2="266" y2="176"/><line x1="512" y1="176" x2="522" y2="176"/>
  </g>
  <text x="390" y="324" text-anchor="middle" fill="#355c72" font-size="14">换基规则来自对象的身份，不来自数字排列得是否一样。</text>
</svg>
