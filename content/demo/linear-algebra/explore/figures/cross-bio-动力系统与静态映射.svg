<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="'Times New Roman','Songti SC','Noto Serif SC',SimSun,serif" font-size="15">
  <title>生物神经元的连续状态与人工单元的静态映射不是同一模型</title>
  <desc>生物神经元由膜电位和通道状态随连续时间演化，离散化后仍保留状态，阈值处还可发放并重置。人工速率单元每步只做加权和与激活，没有自动获得这些时间状态。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#355c72"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#b5661f"/></marker>
  </defs>
  <text x="24" y="34" fill="#355c72" font-size="17">生物侧：状态 + 时间 + 事件</text>
  <g fill="#eef6fa" stroke="#6e9db7" stroke-width="1.3">
    <rect x="24" y="54" width="222" height="78" rx="8"/><rect x="286" y="54" width="222" height="78" rx="8"/><rect x="548" y="54" width="222" height="78" rx="8"/>
    <rect x="286" y="182" width="222" height="78" rx="8"/><rect x="548" y="182" width="222" height="78" rx="8"/>
  </g>
  <g fill="#173f56" text-anchor="middle">
    <text x="135" y="88">状态 (V, m, h, n)</text><text x="135" y="114">不是单个加权和</text>
    <text x="397" y="88">CṼ = −F(V, s) + I(t)</text><text x="397" y="114">连续时间演化</text>
    <text x="659" y="88">V ≥ Vth</text><text x="659" y="114">发放 + 重置</text>
    <text x="397" y="216">Vₖ₊₁ = Vₖ + Δt f(Vₖ, sₖ, Iₖ)</text><text x="397" y="242">离散化仍有状态与误差</text>
    <text x="659" y="216">脉冲时刻 tᵢ</text><text x="659" y="242">或连续膜电位</text>
  </g>
  <g stroke="#355c72" stroke-width="1.6" marker-end="url(#a)">
    <line x1="248" y1="93" x2="282" y2="93"/><line x1="510" y1="93" x2="544" y2="93"/>
    <line x1="397" y1="134" x2="397" y2="178"/><line x1="510" y1="221" x2="544" y2="221"/>
  </g>
  <text x="24" y="318" fill="#8e4e17">离散化、门控状态、阈值与重置，都不能从“都有非线性”推出。</text>
  <line x1="24" y1="334" x2="772" y2="334" stroke="#c7d6df"/>
  <text x="24" y="358" fill="#355c72" font-size="17">人工速率单元：r = φ(Wx + b)，静态映射只有在额外假设下才对应局部近似。</text>
</svg>
